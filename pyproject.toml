[tool.poetry]
name = "riot-match-service"
version = "0.1.0"
description = "League of Legends match analytics service using Riot API"
authors = ["Anna Veselova"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.127.0"
uvicorn = { extras = ["standard"], version = "^0.44" }
sqlalchemy = "^2.0.46"
asyncpg = "^0.31.0"
alembic = "^1.18.4"
pydantic = {extras = ["mypy"], version = "^2.12"}
pydantic-settings = "^2.12"
httpx = "^0.28.1"
python-dotenv = "^1.2.2"
orjson = "^3.11.9"


[tool.poetry.group.dev.dependencies]
ruff = "^0.6.7"
black = "^24.8.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.black]
line-length = 88
target-version = ["py311"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
